name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projeto-Loteria
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Projeto-Loteria/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: TypeScript build
        run: npx tsc --noEmit

      - name: Astro build
        run: npm run build

      - name: ETL check
        run: npm run data:check

  e2e:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: Projeto-Loteria
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Projeto-Loteria/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for e2e
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e